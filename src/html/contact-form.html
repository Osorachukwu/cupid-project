<body class="bg-blue-100">

    <div class="bg-white max-w-3xl mx-auto my-32 p-10 rounded-2xl">
        <p class="text-2xl font-bold mb-8">Contact Us</p>

        <form action="" class="space-y-6">
            <div class="flex gap-5">
                <div class="w-1/2">
                    <label for="">First Name *</label>
                    <input type="text" class="mt-2 border border-blue-300 w-full h-10 rounded-md pl-2 outline-blue-400" required>
                </div>
                <div class="w-1/2">
                    <label for="">Last Name *</label>
                    <input type="text" class="mt-2 border border-blue-300 w-full h-10 rounded-md pl-2 outline-blue-400" required>
                </div>
            </div>

            <!-- Email Address -->
            <div>

                <input type="text" class="mt-2 border border-blue-300 w-full h-10 rounded-md pl-2 outline-blue-400" required>
            </div>

            <!-- Query Type -->
            <div>
                <p>Query Type</p>
                <div class="flex gap-5 mt-2">
                    <div class="border border-blue-200 h-10 w-1/2 rounded-md flex items-center gap-2 pl-4" required>
                        <input type="radio" name="query">
                        <label for="">Genral Enquiry</label>
                    </div>
                    <div class="border border-blue-200 h-10 w-1/2 rounded-md flex items-center gap-2 pl-4" required>
                        <input type="radio" name="query">
                        <label for="">Genral Enquiry</label>
                    </div>
                </div>
            </div>

            <!-- Message -->
            <div>
                <p>Message</p>
                <textarea name="" id="" rows="4"
                    class="mt-2 w-full border border-blue-200 rounded-md p-2 outline-blue-400" required></textarea>
            </div>

            <!-- Tearms -->
            <div class="flex items-center gap-5">
                <input type="checkbox">
                <label for="" class="text-sm">I constent to being contacted by the team *</label>
            </div>
