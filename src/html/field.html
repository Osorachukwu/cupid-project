<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../output.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body class="bg-green-500">

    <div class="border-4 border-white h-[80vh] m-10 relative overflow-hidden">
        <!-- Coners -->
         <div class="border-4 border-white rounded-full h-10 w-10 absolute -left-5 -top-5"></div>
         <div class="border-4 border-white rounded-full h-10 w-10 absolute -right-5 -top-5"></div>
         <div class="border-4 border-white rounded-full h-10 w-10 absolute -left-5 -bottom-5"></div>
         <div class="border-4 border-white rounded-full h-10 w-10 absolute -right-5 -bottom-5"></div>
        <!-- center-circle -->
         <div class="h-50 w-50 rounded-full border-4 border-white absolute top-1/2 left-1/2 -translate-1/2"></div>
        <!-- semi-circle -->
        <div
            class="border-4 border-l-0 border-white h-32 w-32 absolute top-1/2 -translate-y-1/2 bg-green-500 rounded-full left-4">
        </div>
        <!-- 18 yard -->
        <div class="border-4 border-l-0 border-white h-50 w-26 absolute top-1/2 -translate-y-1/2 bg-green-500"></div>
        <!-- post -->
        <div class="border-4 border-l-0 border-white h-32 w-16 absolute top-1/2 -translate-y-1/2 bg-green-500"></div>

        <!-- semi-circle right-->
        <div
            class="border-4 border-r-0 border-white h-32 w-32 absolute top-1/2 -translate-y-1/2 bg-green-500 rounded-full right-4">
        </div>
        <!-- 18 yard right-->
        <div class="border-4 border-r-0 border-white h-50 w-26 absolute top-1/2 -translate-y-1/2 bg-green-500 right-0">
        </div>
        <!-- post right-->
        <div class="border-4 border-r-0 border-white h-32 w-16 absolute top-1/2 -translate-y-1/2 bg-green-500 right-0">
        </div>
        <!-- center-line -->
        <div class="bg-white h-full w-1 absolute left-1/2 translate-x-1/2"></div>
        <!-- Keeper -->
        <div class="bg-black h-10 w-10 rounded-full absolute top-1/2 -translate-y-1/2"></div>
        <!-- defense -->
        <div class="bg-black h-10 w-10 rounded-full absolute top-10 left-40"></div>
        <div class="bg-black h-10 w-10 rounded-full absolute top-56 left-40"></div>
        <div class="bg-black h-10 w-10 rounded-full absolute bottom-56 left-40"></div>
        <div class="bg-black h-10 w-10 rounded-full absolute bottom-10 left-40"></div>

    </div>

</body>

</html>
